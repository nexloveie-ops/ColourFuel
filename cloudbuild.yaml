# Only the main-branch push trigger uses this configuration. No database migrations run here.
steps:
  - id: check-and-test
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', 'npm ci --ignore-scripts && npm run check && npm test']
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/colourfuel-web:$COMMIT_SHA', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/colourfuel-web:$COMMIT_SHA']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - colourfuel-web
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/colourfuel-web:$COMMIT_SHA
      - --region=europe-west1
      - --project=$PROJECT_ID
      - --service-account=colourfuel-engine@$PROJECT_ID.iam.gserviceaccount.com
      - --execution-environment=gen2
      - --memory=512Mi
      - --cpu=1
      - --min=0
      - --max=1
      - --min-instances=0
      - --max-instances=1
      - --concurrency=20
      - --timeout=60
      - --update-env-vars=INSTANCE_CONNECTION_NAME=$PROJECT_ID:europe-west1:colourfuel-dev-postgres,DB_NAME=colourfuel,DB_USER=colourfuel-engine@$PROJECT_ID.iam
      - --quiet
  - id: smoke-test
    name: node:22-alpine
    entrypoint: node
    args:
      - --input-type=module
      - -e
      - |
        const root = 'https://colourfuel-web-721850220313.europe-west1.run.app';
        const health = await fetch(root + '/health', {signal: AbortSignal.timeout(30000)});
        if (!health.ok || (await health.json()).status !== 'ok') throw Error('Health check failed');
        const response = await fetch(root + '/api/catalog', {cache:'no-store',signal: AbortSignal.timeout(30000)});
        if (!response.ok) throw Error('Live catalogue HTTP check failed');
        const data = await response.json();
        if (data.data_mode !== 'live' || !data.ingredients?.length || !data.recipes?.length) throw Error('Invalid live catalogue');
        if (data.catalog_preparation !== 'server' || data.nutrient_rankings?.engine !== 'postgresql-window-functions' || data.nutrient_rankings.catalog_read_at !== data.read_at) throw Error('PostgreSQL rankings were not deployed');
        for (const policy of ['with_estimates','source_only']) {
          if (data.nutrient_rankings[policy]?.length !== data.metrics.length) throw Error('Incomplete database ranking metrics');
          for (const metric of data.nutrient_rankings[policy]) {
            if (metric.coverage.total !== data.ingredients.length || metric.rows.length !== metric.coverage.known) throw Error('Incomplete database ranking population');
            if (metric.rows.some((row,i)=>i>0 && row.value>metric.rows[i-1].value)) throw Error('Database ranking order is invalid');
          }
        }
        for(const id of ['kiwi--raw','cauliflower--raw','bulgur--dry','beetroot--boiled','edible-pod-pea--raw']) {
          const food=data.ingredients.find(f=>f.variant_id===id);
          if(!food || !food.source_url || food.nutrients.length!==data.metrics.length) throw Error('Missing Irish ingredient expansion: '+id);
        }
        for(const image of ['rainbow-chicken','vegan-power','signature-salmon']){
          const response=await fetch(root+'/'+image+'.jpg',{method:'HEAD',signal:AbortSignal.timeout(30000)});
          if(!response.ok||!response.headers.get('content-type')?.startsWith('image/jpeg'))throw Error('Missing product image: '+image);
        }
        for (const asset of ['asian-sesame-crunch.jpg','coastal-colour.jpg','mediterranean-garden.jpg','crispy-pork.jpg','ingredient-dill--raw.jpg','ingredient-edamame--cooked.jpg','menu-formulations.mjs','sauce-picker.mjs','ingredient-photos.mjs','nutrition-context.mjs','white-theme.css','ingredient-kiwi-library.jpg','ingredient-bulgur-library.jpg']) {
          const response = await fetch(root + '/' + asset, {method:'HEAD',signal:AbortSignal.timeout(30000)});
          if (!response.ok) throw Error('Missing deployed Bowl asset: ' + asset);
        }
        const menu = await (await fetch(root + '/product-content.mjs', {cache:'no-store',signal:AbortSignal.timeout(30000)})).text();
        if (!menu.includes('Everyday Chicken') || !menu.includes('Vegan base') || !menu.includes('base_nutrition')) throw Error('New menu or corrected Passport was not deployed');
        console.log('Live database catalogue verified:', data.ingredients.length, 'ingredients;', data.recipes.length, 'recipes');
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
